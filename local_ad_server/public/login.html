<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Digital Signage - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#FFFADC] dark:bg-[#031118] text-slate-800 dark:text-slate-100 min-h-screen flex justify-center items-center relative transition-colors duration-300 m-0">
    <!-- Nút Toggle Theme ở góc trên bên phải màn hình đăng nhập -->
    <button class="absolute top-6 right-6 bg-white dark:bg-[#065084]/60 hover:bg-slate-100 dark:hover:bg-[#065084] text-slate-700 dark:text-cyan-200 px-4 py-2 rounded-xl text-sm font-medium transition border border-[#A3DC9A]/60 dark:border-[#0F828C]/40 shadow-sm flex items-center space-x-2"
            onclick="toggleTheme()" >
        <span id="themeIcon">☀️</span>
        <span id="themeText">Light Mode</span>
    </button>

    <!-- Card Đăng nhập -->
    <div class="bg-white dark:bg-[#065084]/60 backdrop-blur p-8 rounded-2xl border border-[#A3DC9A]/60 dark:border-[#0F828C]/30 shadow-xl w-full max-w-sm transition-colors duration-300">
        <div class="text-center mb-6">
            <span class="text-3xl">📺</span>
            <h2 class="text-xl font-bold text-slate-800 dark:text-white mt-2">Đăng Nhập</h2>
            <p class="text-xs text-slate-500 dark:text-cyan-200 mt-1">Hệ thống quản lý Digital Signage</p>
        </div>

        <div id="errorMsg" class="text-red-500 dark:text-red-400 text-xs text-center mb-4 font-medium"></div>

        <form class="space-y-4" id="loginForm">
            <div>
                <label class="block text-xs font-medium text-slate-600 dark:text-cyan-200 mb-1">Tên đăng nhập</label>
                <input class="w-full bg-slate-50 dark:bg-[#031118]/60 border border-slate-200 dark:border-[#0F828C]/40 rounded-xl px-4 py-2.5 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:border-[#A3DC9A] dark:focus:border-cyan-300 transition text-sm"
                    type="text" id="username" placeholder="Nhập username..." required><br>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-600 dark:text-cyan-200 mb-1">Mật khẩu</label>
                <input class="w-full bg-slate-50 dark:bg-[#031118]/60 border border-slate-200 dark:border-[#0F828C]/40 rounded-xl px-4 py-2.5 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:border-[#A3DC9A] dark:focus:border-cyan-300 transition text-sm"
                    type="password" id="password" placeholder="Nhập mật khẩu..." required><br>
            </div>
            
            <button class="w-full bg-[#A3DC9A] dark:bg-[#0F828C] hover:bg-[#92cb87] dark:hover:bg-[#0d6d76] text-slate-900 dark:text-white font-semibold py-2.5 rounded-xl transition shadow-sm text-sm"
                type="submit">Đăng nhập</button>
        </form>
    </div>

    <script>
        // --- ĐỒNG BỘ THEME TỪ LOCALSTORAGE ---
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            htmlElement.classList.remove('dark');
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark Mode';
        } else {
            htmlElement.classList.add('dark');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';
        }

        function toggleTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            }
        }

        // xử lý đăng nhập
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                if (result.success) {
                    window.location.href = result.redirectUrl;
                } else {
                    document.getElementById('errorMsg').textContent = result.message;
                }
            } catch (err) {
                document.getElementById('errorMsg').textContent = 'Có lỗi xảy ra khi kết nối server';
            }
        });
    </script>
</body>
</html>
