<!DOCTYPE html>
<html lang="vi" class="dark"> <!-- Mặc định bật sẵn chế độ Dark -->
<head>
    <meta charset="UTF-8">
    <title> Ads Server Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Cấu hình Tailwind để hỗ trợ chế độ class dark mode thủ công
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>

<!-- Sử dụng cấu hình màu linh hoạt theo class dark của thẻ html -->
<body class="bg-[#FFFADC] dark:bg-[#031118] text-slate-800 dark:text-slate-100 min-h-screen p-6 transition-colors duration-300">

    <!-- Header -->
    <header class="flex justify-between items-center bg-white dark:bg-[#065084] px-6 py-4 rounded-2xl border border-[#A3DC9A]/60 dark:border-[#0F828C]/40 shadow-md transition-colors duration-300 mb-8">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">📺</span>
            <h1 class="text-xl font-bold tracking-wide text-slate-800 dark:text-white">
                Quản lý quảng cáo TV
                <span class="bg-[#A3DC9A] dark:bg-[#0F828C] text-slate-900 dark:text-white text-xs px-2.5 py-1 rounded-full uppercase ml-2 font-semibold">
                    ADMIN
                </span>
            </h1>
        </div>

        <div class="flex items-center space-x-3">
            <!-- NÚT TOGGLE DARK/LIGHT MODE -->
            <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-[#031118]/60 hover:bg-slate-200 dark:hover:bg-[#031118] text-slate-700 dark:text-cyan-200 px-4 py-2 rounded-xl text-sm font-medium transition border border-slate-200 dark:border-[#0F828C]/40 flex items-center space-x-2">
                <span id="themeIcon">☀️</span>
                <span id="themeText">Light Mode</span>
            </button>
        
            <!-- Nút Đăng xuất -->
            <button class="bg-red-50 dark:bg-red-500/20 hover:bg-red-100 dark:hover:bg-red-500/30 text-red-600 dark:text-red-300 px-4 py-2 rounded-xl text-sm font-medium transition border border-red-200 dark:border-red-500/30" onclick="logout()">
                Đăng xuất
            </button>
        </div>
    </header>
    
    <!-- Main Container -->
    <div class="flex flex-col lg:flex-row gap-6">
        
        <!-- COT TRAI: Sidebar danh sách TV -->
        <div class="w-full lg:w-1/4 bg-white dark:bg-[#065084]/60 backdrop-blur p-5 rounded-2xl border border-[#A3DC9A]/60 dark:border-[#0F828C]/30 shadow-md dark:shadow-xl h-fit transition-colors duration-300">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-semibold text-slate-700 dark:text-cyan-200">Danh sách TV</h2>
                <!-- <span class="text-xs bg-[#A3DC9A]/40 dark:bg-[#0F828C] text-slate-700 dark:text-white px-2 py-0.5 rounded-full font-medium">
                    LAN
                </span> -->
            </div>
            <div class="space-y-3" id="deviceListContainer">
                <p class="text-slate-400 dark:text-slate-300 text-sm italic">Đang tải danh sách thiết bị...</p>
            </div>
        </div>

        <!-- COT PHAI: Nội dung chính -->
        <div class="flex-1 space-y-6">
            
            <!-- Playlist Card -->
            <div class="bg-white dark:bg-[#065084]/60 backdrop-blur p-6 rounded-2xl border border-[#A3DC9A]/60 dark:border-[#0F828C]/30 shadow-md dark:shadow-xl transition-colors duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-800 dark:text-white">
                        Playlist hiện tại của:  
                        <span class="text-emerald-700 dark:text-[#0F828C] bg-[#A3DC9A]/30 dark:bg-cyan-950/60 px-2.5 py-1 rounded-lg font-bold" id="labelDevice">TV_01</span>
                    </h2>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 dark:border-[#0F828C]/40 text-slate-500 dark:text-cyan-200 text-xs uppercase tracking-wider bg-slate-50/50 dark:bg-transparent">
                                <th class="py-3 px-4">ID</th>
                                <th class="py-3 px-4">Tiêu đề</th>
                                <th class="py-3 px-4">Loại</th>
                                <th class="py-3 px-4">Thời lượng (s)</th>
                                <th class="py-3 px-4 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-[#0F828C]/20 text-sm" id="playlistTableBody">
                            <tr><td class="py-6 text-center text-slate-400 dark:text-slate-300 italic" colspan="5">Đang tải...</td></tr>
                        </tbody>
                        <!-- ${playlist.map(item => `
                            <tr>
                                <td>${item.id}</td>
                                <td>${item.title}</td>
                                <td><b>${item.type.toUpperCase()}</b></td>
                                <td>${item.duration}</td>
                                <td><a href="/delete/${item.id}"><button>Xoa</button></a></td>
                            </tr>
                        `).join('')} -->
                    </table>
                </div>  
            </div>

            <!-- Upload Card -->
            <div class="bg-white dark:bg-[#065084]/60 backdrop-blur p-6 rounded-2xl border border-[#A3DC9A]/60 dark:border-[#0F828C]/30 shadow-md dark:shadow-xl transition-colors duration-300">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4">📤 Tải lên tệp ảnh hoặc video</h2>
                <form class="space-y-4" action="/upload" method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="deviceId" id="formDeviceId" value="TV_01">
                    <div>
                        <!-- <label class="block text-sm text-slate-600 dark:text-cyan-200 mb-1">Chọn tệp (Ảnh / Video):</label> -->
                        <input class="w-full text-sm text-slate-500 dark:text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-[#A3DC9A] dark:file:bg-[#0F828C] file:text-slate-900 dark:file:text-white hover:file:bg-[#92cb87] dark:hover:file:bg-[#0d6d76] cursor-pointer bg-slate-50 dark:bg-[#031118]/60 rounded-xl border border-slate-200 dark:border-[#0F828C]/40 p-2 transition" 
                        type="file" name="mediaFile" required accept="image/*,video/*"> <br><br>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-600 dark:text-cyan-200 mb-1">Tiêu đề:</label>
                            <input class="w-full bg-slate-50 dark:bg-[#031118]/60 border border-slate-200 dark:border-[#0F828C]/40 rounded-xl px-4 py-2.5 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:border-[#A3DC9A] dark:focus:border-cyan-300 transition"
                            type="text" name="title" placeholder="Nhập tiêu đề quảng cáo...">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-600 dark:text-cyan-200 mb-1">Thời lượng hiển thị nếu là ảnh (giây):</label>
                            <input class="w-full bg-slate-50 dark:bg-[#031118]/60 border border-slate-200 dark:border-[#0F828C]/40 rounded-xl px-4 py-2.5 text-slate-800 dark:text-white focus:outline-none focus:border-[#A3DC9A] dark:focus:border-cyan-300 transition"
                            type="number" name="duration" value="10" min="1">
                        </div>
                    </div>
            
                    <button class="bg-[#A3DC9A] dark:bg-[#0F828C] hover:bg-[#92cb87] dark:hover:bg-[#0d6d76] text-slate-900 dark:text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-sm"
                    type="submit">
                        Tải lên
                    </button>                       
                </form> 
            </div>

            <!-- Add Device Card -->
            <div class="bg-white dark:bg-[#065084]/60 backdrop-blur p-6 rounded-2xl border border-[#A3DC9A]/60 dark:border-[#0F828C]/30 shadow-md dark:shadow-xl transition-colors duration-300">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-3">➕Thêm TV mới</h2>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input class="flex-1 bg-slate-50 dark:bg-[#031118]/60 border border-slate-200 dark:border-[#0F828C]/40 rounded-xl px-4 py-2.5 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:border-[#A3DC9A] dark:focus:border-cyan-300 transition"
                    type="text" id="newDeviceIdInput" placeholder="Vi du: tv_sanh8">
                    <button class="bg-[#A3DC9A] dark:bg-[#0F828C] hover:bg-[#92cb87] dark:hover:bg-[#0d6d76] text-slate-900 dark:text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-sm"
                    onclick="addNewDevice()">Thêm TV</button>
                </div>
            </div>
        </div>
    </div>
    

    <script>
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        //dong bo device id giua input va form upload
        //const inputDeviceId = document.getElementById('currentDeviceId');
        const formDeviceId = document.getElementById('formDeviceId');
        const labelDevice = document.getElementById('labelDevice')
        const deviceListContainer = document.getElementById('deviceListContainer');
        const newDeviceIdInput = document.getElementById('newDeviceIdInput');

        //lay tham so tren url
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        //kiem tra quyen admin
        async function checkAdminAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (!data.success || data.user.role !== 'admin') {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                window.location.href = '/login.html';
            }
        }
        checkAdminAuth();
        //dang xuat
        async function logout() {
            await fetch('/api/logout');
            window.location.href = '/login.html';
        }

        //neu tren url co truyen deviceId sau khi upload/delete tu dong gan vao o input
        const urlDeviceId = getQueryParam('deviceId');
        let initialDevice = "tv_01";
        if (urlDeviceId) {
            initialDevice = urlDeviceId;
            // formDeviceId.value = urlDeviceId;
            // labelDevice.textContent = urlDeviceId;            
        }

        //dong bo gia tri input va load du lieu
        function setActiveDevice(deviceId) {
            // inputDeviceId.value = deviceId;
            formDeviceId.value = deviceId;
            labelDevice.textContent = deviceId;
            loadPlaylist(deviceId);
            loadDeviceList();
        }

        // inputDeviceId.addEventListener('input', function() {
        //     formDeviceId.value = this.value;
        //     labelDevice.textContent = this.value;
        //     loadPlaylist();
        // });

        //them tv moi vao danh sach
        async function addNewDevice() {
            const newId = newDeviceIdInput.value.trim();
            if (!newId) {
                alert('Vui lòng nhập thiết bị mới!');
                return;
            }

            try {
                //goi api tao playlist cho tv moi
                const response = await fetch(`/api/playlist?deviceId=${newId}`);
                const result = await response.json();

                if (result.success !== false) {
                    newDeviceIdInput.value = ''; //xoa o nhap
                    setActiveDevice(newId); //chuyen sang trang quan ly tv vua tao
                } else {
                    alert('Không thể tạo thiết bị mới');
                }
            } catch (err) {
                console.error('Lỗi thêm thiết bị', err);
                alert('Có lỗi xảy ra khi thêm thiết bị');
            }
        }

        //tai danh sach TV tu server
        async function loadDeviceList() {
            try {
                const response = await fetch('/api/devices');
                const result = await response.json();

                if (result.success && result.devices) {
                    deviceListContainer.innerHTML = '';
                    const devices = result.devices;
                    const deviceKeys = Object.keys(devices);

                    if (deviceKeys.length === 0) {
                        deviceListContainer.innerHTML = '<p class="text-slate-400 dark:text-slate-300 text-sm italic"> Chưa có thiết bị mới</p>';
                        return;              
                    }

                    const currentActiveId = formDeviceId.value;

                    deviceKeys.forEach(devId => {
                        const itemsCount = devices[devId].length || 0;
                        const isCurrent = devId === currentActiveId;

                        const div = document.createElement('div');
                        div.className = isCurrent
                            ? 'p-3 rounded-xl bg-[#A3DC9A]/30 dark:bg-[#0F828C]/40 border border-[#A3DC9A] dark:border-cyan-400 flex justify-between items-center transition shadow-sm'
                            : 'p-3 rounded-xl bg-slate-50 dark:bg-[#031118]/40 border border-slate-200 dark:border-[#0F828C]/20 hover:bg-slate-100 dark:hover:bg-[#0F828C]/20 flex justify-between items-center transition';
                        
                        div.innerHTML = `
                            <div>
                                <strong class="text-slate-800 dark:text-white font-semibold">${devId}</strong><br>
                                <span class="text-xs text-slate-500 dark:text-cyan-300">${itemsCount} tệp</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button class="bg-[#A3DC9A] dark:bg-[#0F828C] hover:bg-[#92cb87] dark:hover:bg-[#0d6d76] text-slate-900 dark:text-white font-medium px-3 py-1.5 rounded-lg text-xs transition"
                                onClick="setActiveDevice('${devId}')">Quản lý</button>
                                <button class="bg-red-50 dark:bg-red-500/20 hover:bg-red-100 dark:hover:bg-red-500/30 text-red-600 dark:text-red-300 border border-red-200 dark:border-red-500/30 px-2.5 py-1.5 rounded-lg text-xs transition"
                                onClick="deleteDevice('${devId}')">Xoá</button>
                            </div>
                        `;
                        deviceListContainer.appendChild(div);
                    });
                }
            } catch (err) {
                console.error('Lỗi tải danh sách thiết bị', err);
            }
        }

        //tai playlist theo deviceId hien tai
        async function loadPlaylist(deviceId) {
            // const deviceId = inputDeviceId.value;
            // formDeviceId.value = deviceId;
            // labelDevice.textContent = deviceId;

            try {
                const response = await fetch(`/api/playlist?deviceId=${deviceId}&admin=true`);
                const result = await response.json();

                const tbody = document.getElementById('playlistTableBody');
                tbody.innerHTML = '';

                    if (!result.items || result.items.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-400 dark:text-slate-300 italic">Chưa có quảng cáo cho thiết bị </td></tr>'; 
                        return;
                    }
                    result.items.forEach(item => {
                        const isHidden = item.isHidden === true;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 dark:hover:bg-[#0F828C]/10 transition border-b border-slate-100 dark:border-[#0F828C]/20";
                        tr.innerHTML = `
                            <td class="py-3 px-4 text-slate-500 dark:text-cyan-200 font-mono text-xs">${item.id}</td>
                            <td class="py-3 px-4 text-slate-800 dark:text-white font-medium">${item.title || ''}</td>
                            <td class="py-3 px-4">
                                <span class="px-2.5 py-1 rounded-md text-xs font-bold ${item.type.toUpperCase() === 'VIDEO' 
                                ? 'bg-blue-50 dark:bg-cyan-950 text-blue-600 dark:text-cyan-300 border border-blue-200 dark:border-cyan-700'
                                : 'bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-700'}">
                                    ${item.type.toUpperCase()}
                                </span>
                            </td>
                            <td class="py-3 px-4 text-slate-600 dark:text-cyan-100">${item.duration}</td>
                            <td class="py-3 px-4 text-center space-x-2">
                                <button class="px-3 py-1.5 rounded-lg text-xs font-medium transition text-white ${isHidden ? 'bg-slate-400 hover:bg-slate-500' : 'bg-[#A3DC9A] dark:bg-emerald-600 hover:bg-[#92cb87] dark:hover:bg-emerald-500 text-slate-900 dark:text-white font-semibold'}"
                                    onclick="toggleAdVisibility('${deviceId}', '${item.id}', ${isHidden})">
                                    ${isHidden ? 'Đang ẩn' : 'Đang hiện'}
                                </button>
                                <button class="bg-red-50 dark:bg-red-600/30 hover:bg-red-100 dark:hover:bg-red-600/40 text-red-600 dark:text-red-300 border border-red-200 dark:border-red-500/30 px-3 py-1.5 rounded-lg text-xs transition"
                                onclick="deletePlaylistItem('${deviceId}', '${item.id}')">Xoá</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                
            } catch (err) {
                console.error('Lỗi tải playlist', err);
            }
             //goi khi load trang
            // loadPlaylist();
        }

        //an hien quang cao
        async function toggleAdVisibility(deviceId, adId, show) {
            try {
                const response = await fetch('/api/toggle-ad', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ deviceId, adId, show })
                });
                const result = await response.json();
                
                if (result.success) {
                    // Tải lại bảng playlist để cập nhật màu sắc và chữ trên nút bấm ngay lập tức
                    loadPlaylist(deviceId);
                } else {
                    alert('Không thể thay đổi trạng thái quảng cáo: ' + (result.message || "Lỗi không xác định"));
                }
            } catch (err) {
                console.error('Lỗi khi đổi trạng thái ad', err);
                alert('Có lỗi xảy ra khi kết nối server');
            }
        }

        //xoa thiet bi tv
        async function deleteDevice(deviceId) {
            if (!confirm(`Bạn có chắc chắn muốn xoá "${deviceId}"? Toàn bộ playlist của thiết bị này cũng sẽ mất`)) {
                return;
            }

            try {
                const response = await fetch(`/api/delete-device/${deviceId}`, { method: 'DELETE' });
                const result = await response.json();

                if (result.success) {
                    //neu thiet bi dang chon bi xoa, tu dong chuyen ve thiet bi dau tien
                    if ( formDeviceId.value === deviceId) {
                        const resDevices = await fetch('/api/devices');
                        const dataDevices = await resDevices.json();
                        const remainingKeys = Object.keys(dataDevices.devices || {});

                        if (remainingKeys.length > 0) {
                            // setActiveDevice(remainingKeys[0]);
                            //neu con thiet bi, chuyen sang thiet bi dau tien
                            window.location.href = `/?deviceId=${remainingKeys[0]}`;
                        } else {
                            //neu het thiet bi, chuyen ve trang chu
                            // setActiveDevice('tv_01');
                            window.location.href = '/';
                        }
                    } else {
                        loadDeviceList(); //chi tai lai danh sach ben trai neu xoa thiet bi
                    }
                } else {
                    alert('Không thể xoá thiết bị này')
                }
            } catch (err) {
                console.error('Lỗi khi xoá thiết bị', err);
                alert('Có lỗi khi xoá thiết bị');
            }
        }

        // Xóa một tệp/quảng cáo trong playlist
        async function deletePlaylistItem(deviceId, id) {
            if (!confirm('Bạn chắc chắn muốn xoá tệp này?')) {
                return;
            }

            try {
                const response = await fetch(`/api/playlist/${deviceId}/${id}`, {
                    method: 'DELETE' // Dùng phương thức DELETE chuẩn REST
                });
                const result = await response.json();

                if (result.success) {
                    loadPlaylist(deviceId); // Tải lại bảng playlist
                    loadDeviceList();      // Cập nhật lại số lượng tệp ở sidebar bên trái
                } else {
                    alert('Không thể xoá tệp: ' + (result.message || 'Lỗi không xác định'));
                }
            } catch (err) {
                console.error('Lỗi khi xoá tệp', err);
                alert('Có lỗi xảy ra khi kết nối server');
            }
        }

        // --- XỬ LÝ CHUYỂN ĐỔI THEME ---
        // Khởi tạo theme từ localStorage hoặc mặc định là dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            htmlElement.classList.remove('dark');
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark Mode';
        } else {
            htmlElement.classList.add('dark');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';
        }

        function toggleTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            }
        }

        //khoi chay khi load trang
        setActiveDevice(initialDevice);
    </script>    
</body>
</html>
